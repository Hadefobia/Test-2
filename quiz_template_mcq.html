        function updateTabArrows() {
            const leftBtn = document.getElementById('tab-arrow-left');
            const rightBtn = document.getElementById('tab-arrow-right');
            if (leftBtn) leftBtn.disabled = currentQuestionIndex <= 0;
            if (rightBtn) rightBtn.disabled = currentQuestionIndex >= quizData.length - 1;
        }

        function goToQuestion(idx) {
            if (idx < 0 || idx >= quizData.length) return;

            const currentCard = document.getElementById(`q-${currentQuestionIndex}`);
            if (currentCard) currentCard.classList.remove('active');
            const currentTab = document.getElementById(`tab-${currentQuestionIndex}`);
            if (currentTab) currentTab.classList.remove('active');

            currentQuestionIndex = idx;

            const newCard = document.getElementById(`q-${currentQuestionIndex}`);
            if (newCard) newCard.classList.add('active');
            const newTab = document.getElementById(`tab-${currentQuestionIndex}`);
            if (newTab) {
                newTab.classList.add('active');
                newTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
            updateTabArrows();
            updateFlagButton();
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                goToQuestion(currentQuestionIndex + 1);
            } else {
                if (quizMode !== 'tutor' && !blockSubmitted) {
                    submitBlock();
                } else {
                    showResults();
                }
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                goToQuestion(currentQuestionIndex - 1);
            }
        }

        function toggleHint(idx) {
            const box = document.getElementById(`hint-box-${idx}`);
            if (box) {
                const isShowing = box.style.display !== 'block';
                box.style.display = isShowing ? 'block' : 'none';
                if (isShowing) {
                    const card = document.getElementById(`q-${idx}`);
                    if (card) card.setAttribute('data-hint-used', 'true');
                }
            }
        }

        function strikeOption(e, qIdx, oIdx) {
            e.preventDefault();
            const opt = document.getElementById(`q-${qIdx}-opt-${oIdx}`);
            if (opt && !opt.classList.contains('locked')) opt.classList.toggle('crossed');
        }

        function selectOption(qIdx, oIdx) {
            const card = document.getElementById(`q-${qIdx}`);
            const optEl = document.getElementById(`q-${qIdx}-opt-${oIdx}`);
            if (!card || !optEl || optEl.classList.contains('crossed')) return;

            // In timed/untimed mode (before grading): just select, don't grade
            if (quizMode !== 'tutor' && !blockSubmitted) {
                // Remove previous selection
                card.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
                optEl.classList.add('selected');
                userAnswers[qIdx] = oIdx;

                // Update tab to show it's been touched
                const tab = document.getElementById(`tab-${qIdx}`);
                if (tab && !tab.classList.contains('answered-correct') && !tab.classList.contains('answered-wrong')) {
                    tab.style.borderColor = 'var(--amb-primary)';
                    tab.style.color = 'var(--amb-primary)';
                }

                // Update progress count for selected
                const selected = userAnswers.filter(a => a !== -1).length;
                const progressText = document.getElementById('progress-text');
                if (progressText) progressText.innerText = `Selected ${selected} of ${quizData.length}`;
                return;
            }

            // Tutor mode (or after block submitted): can't re-answer
            if (card.dataset.answered === "true") return;

            if (!timerRunning && quizMode === 'tutor') {
                timerRunning = true;
                stats.startTime = Date.now();
                startTimer();
            }

            const correct = quizData[qIdx].correctIndex;
            const segment = document.getElementById(`seg-${qIdx}`);
            const tab = document.getElementById(`tab-${qIdx}`);

            if (oIdx === correct) {
                optEl.classList.add('correct');
                card.dataset.answered = "true";

                if (!card.hasAttribute('data-failed')) {
                    stats.firstTryCorrect++;
                    const usedHint = card.hasAttribute('data-hint-used');
                    if (usedHint) {
                        if (segment) segment.classList.add('helped');
                        if (tab) tab.classList.add('answered-helped');
                    } else {
                        if (segment) segment.classList.add('correct');
                        if (tab) tab.classList.add('answered-correct');
                    }
                } else {
                    stats.eventualCorrect++;
                    if (segment) segment.classList.add('wrong');
                    if (tab) tab.classList.add('answered-wrong');
                }

                finalizeQuestion(qIdx);
            } else {
                optEl.classList.add('wrong');
                card.dataset.answered = "true";

                if (!card.hasAttribute('data-failed')) {
                    card.setAttribute('data-failed', 'true');
                }
                if (segment) segment.classList.add('wrong');
                if (tab) tab.classList.add('answered-wrong');

                const correctIdx = quizData[qIdx].correctIndex;
                const correctEl = document.getElementById(`q-${qIdx}-opt-${correctIdx}`);
                if (correctEl) correctEl.classList.add('correct');

                finalizeQuestion(qIdx);
            }
        }

        function revealAnswer(qIdx) {
            const card = document.getElementById(`q-${qIdx}`);
            if (card.dataset.answered === "true") return;

            if (!timerRunning) {
                timerRunning = true;
                stats.startTime = Date.now();
                startTimer();
            }

            card.dataset.answered = "true";
            card.setAttribute('data-failed', 'true');
            const segment = document.getElementById(`seg-${qIdx}`);
            if (segment) segment.classList.add('wrong');
            const tab = document.getElementById(`tab-${qIdx}`);
            if (tab) tab.classList.add('answered-wrong');

            const correctIdx = quizData[qIdx].correctIndex;
            const optEl = document.getElementById(`q-${qIdx}-opt-${correctIdx}`);
            if (optEl) optEl.classList.add('correct');

            finalizeQuestion(qIdx);
        }

        function finalizeQuestion(qIdx) {
            stats.completed++;
            const expSec = document.getElementById(`exp-${qIdx}`);
            const revealBtn = document.getElementById(`reveal-btn-${qIdx}`);

            if (expSec) expSec.style.display = 'block';
            if (revealBtn) revealBtn.style.display = 'none';

            // Show retry button
            const retryBtn = document.getElementById(`retry-btn-${qIdx}`);
            if (retryBtn) retryBtn.style.display = 'inline-flex';

            document.querySelectorAll(`#q-${qIdx} .option`).forEach(o => o.classList.add('locked'));
            updateProgress();
        }

        function updateProgress() {
            const total = quizData.length;
            const progressText = document.getElementById('progress-text');
            if (progressText) progressText.innerText = `Answered ${stats.completed} of ${total}`;

            const accuracy = Math.round((stats.firstTryCorrect / Math.max(1, stats.completed)) * 100);
            const scorePercent = document.getElementById('score-percent');
            if (scorePercent) scorePercent.innerText = `Accuracy: ${accuracy}%`;

        function handleKeyInput(e) {
            if (document.getElementById('input-view').style.display !== 'none') return;
            if (document.getElementById('results-view').classList.contains('visible')) return;
            if (document.getElementById('review-overlay').classList.contains('open')) return;

            // Arrow keys for tab navigation
            if (e.key === 'ArrowRight') { e.preventDefault(); goToQuestion(currentQuestionIndex + 1); return; }
            if (e.key === 'ArrowLeft') { e.preventDefault(); goToQuestion(currentQuestionIndex - 1); return; }

            // Enter to advance to next question
            if (e.key === 'Enter') { nextQuestion(); return; }

            const activeCard = document.getElementById(`q-${currentQuestionIndex}`);
            if (!activeCard) return;

            // In tutor mode, skip if already answered. In timed/untimed, allow re-selection until block submitted
            if (quizMode === 'tutor' && activeCard.dataset.answered === "true") return;
            if (quizMode !== 'tutor' && blockSubmitted) return;

            const key = e.key.toUpperCase();
            const map = { 'A': 0, '1': 0, 'B': 1, '2': 1, 'C': 2, '3': 2, 'D': 3, '4': 3, 'E': 4, '5': 4, 'F': 5 };
            if (map.hasOwnProperty(key)) selectOption(currentQuestionIndex, map[key]);
        }

        function downloadQuizHTML() {
            const jsonData = JSON.stringify(quizData, null, 2);
            const notesData = document.getElementById('notes-content').value || '';
            // Use the clean original HTML captured at load time
            let htmlStr = ORIGINAL_HTML;

            // Inject the JSON into the embedded-quiz-data script tag
            const scriptTagRegex = /(<script id="embedded-quiz-data" type="application\/json">)[\s\S]*?(<\/script>)/;
            htmlStr = htmlStr.replace(scriptTagRegex, `$1${jsonData}$2`);

            // Inject notes into the embedded-notes-data tag
            const notesTagRegex = /(<script id="embedded-notes-data" type="text\/plain">)[\s\S]*?(<\/script>)/;
            htmlStr = htmlStr.replace(notesTagRegex, `$1${notesData}$2`);

            // Serialize and inject session state
            const sessionState = {
                stats,
                currentQuestionIndex,
                flaggedQuestions: Array.from(flaggedQuestions),
                blockSubmitted,
                userAnswers,
                quizMode,
                timerTime: document.getElementById('quiz-timer').innerText
            };
            const sessionTagRegex = /(<script id="embedded-session-data" type="application\/json">)[\s\S]*?(<\/script>)/;
            htmlStr = htmlStr.replace(sessionTagRegex, `$1${JSON.stringify(sessionState, null, 2)}$2`);

            const blob = new Blob([htmlStr], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const title = document.title || 'quiz';
            a.href = url;
            a.download = title.replace(/[^a-zA-Z0-9]/g, '_') + '.html';
            a.click();
            URL.revokeObjectURL(url);
        }

        // --- CALCULATOR ---
        function calcInput(val) {
            const d = document.getElementById('calc-display');
            if (val === 'C') { calcState = { display: '0', prev: null, op: null, reset: false }; d.innerText = '0'; return; }
            if (val === '⌫') { calcState.display = calcState.display.length > 1 ? calcState.display.slice(0, -1) : '0'; d.innerText = calcState.display; return; }
            if (val === '±') { calcState.display = String(-parseFloat(calcState.display)); d.innerText = calcState.display; return; }
            if (val === '%') { calcState.display = String(parseFloat(calcState.display) / 100); d.innerText = calcState.display; return; }
            if (['+', '-', '×', '÷'].includes(val)) {
                if (calcState.op && !calcState.reset) calcExecute();
                calcState.prev = parseFloat(calcState.display);
                calcState.op = val;
                calcState.reset = true;
                return;
            }
            if (val === '=') { calcExecute(); calcState.op = null; return; }
            // Digit or decimal
            if (calcState.reset) { calcState.display = '0'; calcState.reset = false; }
            if (val === '.' && calcState.display.includes('.')) return;
            calcState.display = calcState.display === '0' && val !== '.' ? val : calcState.display + val;
            d.innerText = calcState.display;
        }

        function calcExecute() {
            if (calcState.prev === null || !calcState.op) return;
            const cur = parseFloat(calcState.display);
            let result = 0;
            switch (calcState.op) {
                case '+': result = calcState.prev + cur; break;
                case '-': result = calcState.prev - cur; break;
                case '×': result = calcState.prev * cur; break;
                case '÷': result = cur !== 0 ? calcState.prev / cur : 'Error'; break;
            }
            calcState.display = String(result);
            calcState.prev = result;
            calcState.reset = true;
            document.getElementById('calc-display').innerText = calcState.display;
        }

        function renderLabValues() {
            const body = document.getElementById('lab-body');
            if (!body) return;
            body.innerHTML = LAB_DATA.map(cat => `
                <div class="lab-category">
                    <div class="lab-category-header" onclick="this.parentElement.classList.toggle('collapsed')">
                        ${cat.category}
                    </div>
                    <div class="lab-rows">
                        ${cat.rows.map(r => `<div class="lab-row"><span class="lab-name">${r[0]}</span><span class="lab-range">${r[1]}</span></div>`).join('')}
                    </div>
                </div>
            `).join('');
        }

        /* === NEW FEATURE FUNCTIONS === */

        // --- SUBMIT BLOCK (Timed/Untimed) ---
        function submitBlock() {
            if (blockSubmitted) return;
            showModal(
                "End Block?",
                "All answers will be graded. Unanswered questions count as wrong.",
                "Grade All",
                () => {
                    blockSubmitted = true;
                    clearInterval(timerInterval);

                    // If untimed, record total time
                    if (quizMode === 'untimed') {
                        stats.totalTimeSeconds = 0;
                    }

                    gradeAllQuestions();

                    // Hide end block button
                    const endBtn = document.getElementById('end-block-btn');
                    if (endBtn) endBtn.style.display = 'none';

                    openReview();
                }
            );
        }

        // --- GRADE ALL QUESTIONS ---
        function gradeAllQuestions() {
            quizData.forEach((q, qIdx) => {
                const card = document.getElementById(`q-${qIdx}`);
                if (!card) return;

                const selectedIdx = userAnswers[qIdx];
                const correct = q.correctIndex;
                const segment = document.getElementById(`seg-${qIdx}`);
                const tab = document.getElementById(`tab-${qIdx}`);

                // Clear any inline styles from pre-submit selection
                if (tab) { tab.style.borderColor = ''; tab.style.color = ''; }

                // Remove selection styling
                card.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));

                if (selectedIdx === -1) {
                    // Unanswered
                    card.dataset.answered = "true";
                    card.setAttribute('data-failed', 'true');
                    if (segment) segment.classList.add('wrong');
                    if (tab) tab.classList.add('answered-wrong');
                    // Show correct answer
                    const correctEl = document.getElementById(`q-${qIdx}-opt-${correct}`);
                    if (correctEl) correctEl.classList.add('correct');
                } else if (selectedIdx === correct) {
                    // Correct
                    const optEl = document.getElementById(`q-${qIdx}-opt-${selectedIdx}`);
                    if (optEl) optEl.classList.add('correct');
                    card.dataset.answered = "true";
                    stats.firstTryCorrect++;

                    const usedHint = card.hasAttribute('data-hint-used');
                    if (usedHint) {
                        if (segment) segment.classList.add('helped');
                        if (tab) tab.classList.add('answered-helped');
                    } else {
                        if (segment) segment.classList.add('correct');
                        if (tab) tab.classList.add('answered-correct');
                    }
                } else {
                    // Wrong
                    const optEl = document.getElementById(`q-${qIdx}-opt-${selectedIdx}`);
                    if (optEl) optEl.classList.add('wrong');
                    card.dataset.answered = "true";
                    card.setAttribute('data-failed', 'true');
                    if (segment) segment.classList.add('wrong');
                    if (tab) tab.classList.add('answered-wrong');
                    // Show correct
                    const correctEl = document.getElementById(`q-${qIdx}-opt-${correct}`);
                    if (correctEl) correctEl.classList.add('correct');
                }

                stats.completed++;
                // Show explanations
                const expSec = document.getElementById(`exp-${qIdx}`);
                if (expSec) expSec.style.display = 'block';
                // Lock options
                card.querySelectorAll('.option').forEach(o => o.classList.add('locked'));
                // Show retry button
                const retryBtn = document.getElementById(`retry-btn-${qIdx}`);
                if (retryBtn) retryBtn.style.display = 'inline-flex';
            });

            updateProgress();
        }

        // --- REVIEW SCREEN ---
        function getQuestionStatus(qIdx) {
            const card = document.getElementById(`q-${qIdx}`);
            if (!card || card.dataset.answered !== 'true') return 'unanswered';
            if (!card.hasAttribute('data-failed')) {
                return card.hasAttribute('data-hint-used') ? 'helped' : 'correct';
            }
            return 'wrong';
        }

        function openReview() {
            reviewFilter = 'all';
            const overlay = document.getElementById('review-overlay');
            const statsBar = document.getElementById('review-stats-bar');
            const filtersEl = document.getElementById('review-filters');

            const accuracy = Math.round((stats.firstTryCorrect / Math.max(1, stats.completed)) * 100);
            const m = Math.floor(stats.totalTimeSeconds / 60);
            const s = stats.totalTimeSeconds % 60;
            const flagCount = flaggedQuestions.size;
            const unanswered = quizData.filter((_, i) => getQuestionStatus(i) === 'unanswered').length;

            statsBar.innerHTML = `
                <div class="review-stat"><span class="review-stat-val">${accuracy}%</span><span class="review-stat-lab">Accuracy</span></div>
                <div class="review-stat"><span class="review-stat-val">${stats.firstTryCorrect}/${stats.completed}</span><span class="review-stat-lab">Correct</span></div>
                <div class="review-stat"><span class="review-stat-val">${m}m ${s}s</span><span class="review-stat-lab">Time</span></div>
                <div class="review-stat"><span class="review-stat-val">${quizData.length}</span><span class="review-stat-lab">Total</span></div>
            `;

            const filters = [
                { key: 'all', label: `All (${quizData.length})` },
                { key: 'correct', label: `<span class="dot dot-correct"></span> Correct (${quizData.filter((_, i) => getQuestionStatus(i) === 'correct').length})` },
                { key: 'wrong', label: `<span class="dot dot-wrong"></span> Wrong (${quizData.filter((_, i) => getQuestionStatus(i) === 'wrong').length})` },
                { key: 'helped', label: `<span class="dot dot-helped"></span> Helped (${quizData.filter((_, i) => getQuestionStatus(i) === 'helped').length})` },
                { key: 'flagged', label: `<span class="dot dot-flagged"></span> Flagged (${flagCount})` },
                { key: 'unanswered', label: `<span class="dot dot-unanswered"></span> Unanswered (${unanswered})` },
            ];

            filtersEl.innerHTML = filters.map(f =>
                `<button class="filter-btn ${f.key === 'all' ? 'active' : ''}" onclick="filterReview('${f.key}', this)">${f.label}</button>`
            ).join('');

            renderReviewCards('all');
            overlay.classList.add('open');
        }

        function closeReview() {
            document.getElementById('review-overlay').classList.remove('open');
        }

        function filterReview(filter, btn) {
            reviewFilter = filter;
            document.querySelectorAll('.review-filters .filter-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderReviewCards(filter);
        }

        function renderReviewCards(filter) {
            const grid = document.getElementById('review-grid');
            let indices = quizData.map((_, i) => i);

            if (filter === 'flagged') {
                indices = indices.filter(i => flaggedQuestions.has(i));
            } else if (filter !== 'all') {
                indices = indices.filter(i => getQuestionStatus(i) === filter);
            }

            grid.innerHTML = indices.map(i => {
                const q = quizData[i];
                const status = getQuestionStatus(i);
                const statusIcon = { correct: '✓', wrong: '✗', helped: '~', unanswered: '—' }[status];
                const preview = (q.vignette || q.question || q.questionStem || '').replace(/<[^>]*>/g, '');
                const isFlagged = flaggedQuestions.has(i);

                let answerInfo = '';
                if (status !== 'unanswered') {
                    const selectedIdx = userAnswers[i] !== undefined && userAnswers[i] !== -1 ? userAnswers[i] : -1;
                    const correctIdx = q.correctIndex;
                    if (selectedIdx !== -1) {
                        const isRight = selectedIdx === correctIdx;
                        answerInfo = `<div class="review-card-answer ${isRight ? 'ans-correct' : 'ans-wrong'}">Selected: ${letters[selectedIdx]} ${isRight ? '✓' : '→ Correct: ' + letters[correctIdx]}</div>`;
                    } else {
                        answerInfo = `<div class="review-card-answer ans-wrong">No answer → Correct: ${letters[correctIdx]}</div>`;
                    }
                }

                return `
                    <div class="review-card" onclick="closeReview(); goToQuestion(${i});">
                        <div class="review-card-status st-${status}">${statusIcon}</div>
                        <div class="review-card-body">
                            <div class="review-card-num">Question ${i + 1}${isFlagged ? ' <span class="review-card-flag">Flagged</span>' : ''}</div>
                            <div class="review-card-preview">${preview}</div>
                            ${answerInfo}
                        </div>
                    </div>
                `;
            }).join('');

            if (indices.length === 0) {
                grid.innerHTML = '<p style="text-align:center; color:var(--text-muted); grid-column:1/-1;">No questions match this filter.</p>';
            }
        }

        // --- TEXT HIGHLIGHTING ---
        function setupHighlightListeners() {
            document.addEventListener('mouseup', handleVignetteMouseUp);
            document.addEventListener('mousedown', (e) => {
                const toolbar = document.getElementById('highlight-toolbar');
                if (toolbar && !toolbar.contains(e.target)) {
                    toolbar.classList.remove('show');
                }
            });
        }

        function handleVignetteMouseUp(e) {
            const toolbar = document.getElementById('highlight-toolbar');
            const selection = window.getSelection();
            if (!selection || selection.isCollapsed || !selection.toString().trim()) {
                return;
            }

            // Check if selection is inside a vignette
            const anchor = selection.anchorNode;
            const focus = selection.focusNode;
            const vignette = anchor && anchor.closest ? anchor.closest('.vignette') : (anchor.parentElement ? anchor.parentElement.closest('.vignette') : null);
            if (!vignette) return;

            savedSelection = selection.getRangeAt(0).cloneRange();

            // Position toolbar near selection
            const rect = selection.getRangeAt(0).getBoundingClientRect();
            toolbar.style.top = (rect.top + window.scrollY - 40) + 'px';
            toolbar.style.left = (rect.left + window.scrollX + (rect.width / 2) - 70) + 'px';
            toolbar.classList.add('show');
        }

        function applyHighlight(colorClass) {
            if (!savedSelection) return;

            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(savedSelection);

            if (!sel.isCollapsed && sel.toString().trim()) {
                const mark = document.createElement('mark');
                mark.className = 'quiz-hl' + (colorClass && colorClass !== 'hl-yellow' ? ' ' + colorClass : '');
                try {
                    sel.getRangeAt(0).surroundContents(mark);
                } catch (e) {
                    // If selection spans multiple elements, use extractContents approach
                    const range = sel.getRangeAt(0);
                    const fragment = range.extractContents();
                    mark.appendChild(fragment);
                    range.insertNode(mark);
                }
            }

            sel.removeAllRanges();
            savedSelection = null;
            document.getElementById('highlight-toolbar').classList.remove('show');

            // Persist the highlight to quizData
            const vigEl = document.querySelector(`#q-${currentQuestionIndex} .vignette`);
            if (vigEl && quizData[currentQuestionIndex]) {
                quizData[currentQuestionIndex].vignette = vigEl.innerHTML;
            }
        }

        function removeHighlight() {
            if (!savedSelection) return;

            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(savedSelection);

            const range = sel.getRangeAt(0);
            const container = range.commonAncestorContainer;
            const parent = container.nodeType === 3 ? container.parentNode : container;
            const marks = parent.closest('.quiz-hl') ? [parent.closest('.quiz-hl')] : parent.querySelectorAll ? parent.querySelectorAll('.quiz-hl') : [];

            marks.forEach(m => {
                if (sel.containsNode(m, true)) {
                    const text = document.createTextNode(m.textContent);
                    m.parentNode.replaceChild(text, m);
                }
            });

            sel.removeAllRanges();
            savedSelection = null;
            document.getElementById('highlight-toolbar').classList.remove('show');

            // Persist the removal to quizData
            const vigEl = document.querySelector(`#q-${currentQuestionIndex} .vignette`);
            if (vigEl && quizData[currentQuestionIndex]) {
                quizData[currentQuestionIndex].vignette = vigEl.innerHTML;
            }
        }

        // --- SHUFFLE ---
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // --- SEARCH COUNT ---
        function updateSearchCount() {
            const searchVal = (document.getElementById('search-filter') || {}).value || '';
            const infoEl = document.getElementById('search-info');
            const textarea = document.getElementById('json-textarea');
            if (!infoEl || !textarea) return;

            if (!searchVal.trim()) {
                infoEl.innerText = '';
                return;
            }

            try {
                const input = textarea.value;
                const startIdx = input.indexOf('[');
                const endIdx = input.lastIndexOf(']');
                if (startIdx === -1 || endIdx === -1) { infoEl.innerText = ''; return; }
                const data = JSON.parse(input.substring(startIdx, endIdx + 1));
                const keyword = searchVal.trim().toLowerCase();
                const count = data.filter(q => {
                    const text = (q.vignette || q.question || q.questionStem || '').toLowerCase();
                    const opts = (q.options || []).join(' ').toLowerCase();
                    return text.includes(keyword) || opts.includes(keyword);
                }).length;
                infoEl.innerText = `${count} of ${data.length} questions match`;
            } catch (e) {
                infoEl.innerText = '';
            }
        }
